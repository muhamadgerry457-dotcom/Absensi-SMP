<body class="bg-slate-900 antialiased min-h-screen flex justify-center items-center">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // App ID & Centralized Firebase Config
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'eabsensi-smp-central-v2';
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
    
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyEAbsensiCentralDatabaseKey2026",
          authDomain: "eabsensi-smp-central.firebaseapp.com",
          projectId: "eabsensi-smp-central",
          storageBucket: "eabsensi-smp-central.appspot.com",
          messagingSenderId: "102938475610",
          appId: "1:102938475610:web:9876543210abcdef"
        };

    let app, auth, db;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Firebase initialized in hybrid mode:", e);
    }

    // Expose Bridge to React App
    window.FirebaseBridge = {
      app, auth, db, appId, initialAuthToken,
      signInAnonymously, signInWithCustomToken, onAuthStateChanged,
      doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection,
      isConfigured: !!db
    };

    window.dispatchEvent(new Event('firebase-bridge-ready'));
  </script>

  <div id="root" class="w-full max-w-md min-h-screen bg-slate-100 shadow-2xl relative flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- STANDARDISASI KELAS 7A-7G, 8A-8G, 9A-9G ---
    const KELAS_LIST = [
      '7A', '7B', '7C', '7D', '7E', '7F', '7G',
      '8A', '8B', '8C', '8D', '8E', '8F', '8G',
      '9A', '9B', '9C', '9D', '9E', '9F', '9G'
    ];

    const ATRIBUT_HARI = {
      'Senin': ['Dasi', 'Kaus kaki putih', 'Lokasi sekolah', 'Logo sekolah', 'Bendera', 'Nama', 'Kartu QR', 'Pemeriksaan kuku'],
      'Selasa': ['Kaus kaki putih', 'Pemeriksaan kuku'],
      'Rabu': ['Kacu', 'Kaus kaki hitam', 'Nama', 'Nama pahlawan', 'Pemeriksaan kuku'],
      'Kamis': ['Dasi', 'Kaus kaki putih', 'Lokasi sekolah', 'Logo sekolah', 'Bendera', 'Nama', 'Kartu QR', 'Pemeriksaan kuku'],
      'Jumat': ['Kaus kaki putih', 'Nama', 'Pemeriksaan kuku'],
      'Sabtu': ['Kaus kaki putih', 'Nama', 'Pemeriksaan kuku'],
      'Minggu': []
    };

    const INITIAL_SCHEDULE = {
      startTime: "05:30",
      onTimeLimit: "06:30",
      updatedBy: "Petugas OSIS",
      updatedAt: new Date().toISOString()
    };

    function normalizePhone(phone) {
      if (!phone) return '';
      let clean = String(phone).trim().replace(/\D/g, '');
      if (clean.startsWith('62')) {
        clean = '0' + clean.slice(2);
      }
      return clean;
    }

    function getJakartaDate() {
      const options = { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' };
      return new Intl.DateTimeFormat('en-CA', options).format(new Date());
    }

    function getJakartaTimeString() {
      return new Date().toLocaleTimeString('id-ID', {
        timeZone: 'Asia/Jakarta',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).replace(/\./g, ':');
    }

    function getJakartaDayName() {
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const dateInJakarta = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));
      return days[dateInJakarta.getDay()];
    }

    // --- MAIN REACT APP ---
    function App() {
      const [students, setStudents] = useState([]);
      const [attendance, setAttendance] = useState([]);
      const [teachers, setTeachers] = useState([]);
      const [schedule, setSchedule] = useState(INITIAL_SCHEDULE);
      const [permits, setPermits] = useState([]);
      const [announcements, setAnnouncements] = useState([]);
      const [grades, setGrades] = useState([]);
      const [attributeChecks, setAttributeChecks] = useState([]);

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('eabsensi_current_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [currentTime, setCurrentTime] = useState(getJakartaTimeString());
      const [currentDateStr, setCurrentDateStr] = useState('');
      const [currentDay, setCurrentDay] = useState(getJakartaDayName());

      const [activeTab, setActiveTab] = useState('home');
      const [notification, setNotification] = useState(null);
      const [showLogoutModal, setShowLogoutModal] = useState(false);
      const [showCameraScanner, setShowCameraScanner] = useState(false);
      const [cloudStatus, setCloudStatus] = useState('connected');
      const [notificationPermission, setNotificationPermission] = useState('default');

      // Request Android Push Notification Permission
      useEffect(() => {
        if ("Notification" in window) {
          setNotificationPermission(Notification.permission);
        }
      }, []);

      const requestAndroidNotification = async () => {
        if ("Notification" in window) {
          const perm = await Notification.requestPermission();
          setNotificationPermission(perm);
          if (perm === 'granted') {
            showToast("Izin notifikasi Android telah aktif!", "success");
            sendAndroidPushNotification("E-Absensi Ready", "Notifikasi presensi online aktif di HP Anda.");
          } else {
            showToast("Izin notifikasi ditolak. Aktifkan dari pengaturan HP.", "warning");
          }
        }
      };

      const sendAndroidPushNotification = (title, body) => {
        if ("Notification" in window && Notification.permission === "granted") {
          try {
            new Notification(title, {
              body,
              icon: 'https://placehold.co/192x192/DC2626/FFFFFF?text=E-Absensi',
              badge: 'https://placehold.co/192x192/DC2626/FFFFFF?text=E'
            });
          } catch (e) {
            console.warn("Notification trigger notice:", e);
          }
        }
      };

      // Realtime Firebase Central Sync
      useEffect(() => {
        let unsubscribes = [];
        const initCloudSync = async () => {
          const fb = window.FirebaseBridge;
          if (!fb || !fb.isConfigured) return;

          try {
            if (fb.initialAuthToken) {
              await fb.signInWithCustomToken(fb.auth, fb.initialAuthToken);
            } else {
              await fb.signInAnonymously(fb.auth);
            }

            fb.onAuthStateChanged(fb.auth, (user) => {
              if (user) {
                setCloudStatus('connected');
                const listenCollection = (colName, setter) => {
                  try {
                    const colRef = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', colName);
                    const unsub = fb.onSnapshot(colRef, (snapshot) => {
                      const data = [];
                      snapshot.forEach(doc => data.push(doc.data()));
                      setter(data);
                    });
                    unsubscribes.push(unsub);
                  } catch (e) {}
                };

                listenCollection('students', setStudents);
                listenCollection('attendance', setAttendance);
                listenCollection('teachers', setTeachers);
                listenCollection('permits', setPermits);
                listenCollection('announcements', setAnnouncements);
                listenCollection('grades', setGrades);
                listenCollection('attribute_checks', setAttributeChecks);

                // Schedule Listener
                try {
                  const schedRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'config', 'schedule');
                  const unsubSched = fb.onSnapshot(schedRef, (docSnap) => {
                    if (docSnap.exists()) {
                      setSchedule(docSnap.data());
                    }
                  });
                  unsubscribes.push(unsubSched);
                } catch (e) {}
              }
            });
          } catch (e) {
            setCloudStatus('offline');
          }
        };

        if (window.FirebaseBridge) {
          initCloudSync();
        } else {
          window.addEventListener('firebase-bridge-ready', initCloudSync);
        }

        return () => {
          unsubscribes.forEach(unsub => unsub && unsub());
          window.removeEventListener('firebase-bridge-ready', initCloudSync);
        };
      }, []);

      useEffect(() => {
        localStorage.setItem('eabsensi_current_user', JSON.stringify(currentUser));
      }, [currentUser]);

      // Realtime Clock
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(getJakartaTimeString());
          setCurrentDay(getJakartaDayName());
          const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Jakarta' };
          setCurrentDateStr(new Date().toLocaleDateString('id-ID', options));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const saveToCloud = async (collectionName, docId, data) => {
        const fb = window.FirebaseBridge;
        if (fb && fb.isConfigured && fb.auth?.currentUser) {
          try {
            const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', collectionName, docId);
            await fb.setDoc(docRef, data, { merge: true });
          } catch (e) {
            console.warn(`Firestore save sync error [${collectionName}]:`, e);
          }
        }
      };

      const showToast = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 4000);
      };

      // PERMANENT LOGOUT EXECUTION
      const executePermanentLogout = async () => {
        if (!currentUser) return;

        if (currentUser.role === 'WALI_KELAS') {
          const fb = window.FirebaseBridge;
          if (fb && fb.isConfigured && fb.auth?.currentUser) {
            try {
              const docId = `TCH-${currentUser.class}`;
              const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'teachers', docId);
              await fb.deleteDoc(docRef);
            } catch (e) {}
          }
        }

        setCurrentUser(null);
        localStorage.removeItem('eabsensi_current_user');
        setActiveTab('home');
        setShowLogoutModal(false);
        showToast("Akun Anda telah dihapus secara permanen dari perangkat ini.", "info");
      };

      return (
        <div className="w-full min-h-screen bg-white flex flex-col pb-20 relative">
          
          {/* TOAST NOTIFICATION */}
          {notification && (
            <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-11/12 max-w-sm px-4 py-3 rounded-xl shadow-2xl text-white font-medium text-xs flex items-center justify-between transition-all duration-300 ${
              notification.type === 'error' ? 'bg-red-600' : notification.type === 'warning' ? 'bg-amber-600' : 'bg-emerald-600'
            }`}>
              <div className="flex items-center space-x-2">
                <span>{notification.type === 'error' ? '⚠️' : '✅'}</span>
                <span>{notification.message}</span>
              </div>
              <button onClick={() => setNotification(null)} className="text-white font-bold text-base ml-2">×</button>
            </div>
          )}

          {/* HEADER APLIKASI TEMA MERAH-ORANYE */}
          <header className="gradient-header text-white p-5 rounded-b-3xl shadow-lg relative overflow-hidden shrink-0">
            <div className="flex justify-between items-center mb-2">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-brandRed font-black text-xl shadow-md">
                  E
                </div>
                <div>
                  <h1 className="text-lg font-black tracking-tight leading-none">E-ABSENSI</h1>
                  <p className="text-[10px] text-orange-100 mt-0.5">Sistem Presensi Android Presisi</p>
                </div>
              </div>

              {/* NOTIFICATION PERMISSION BADGE */}
              <button 
                onClick={requestAndroidNotification} 
                className="bg-black/30 hover:bg-black/50 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/20 text-[10px] text-white font-semibold flex items-center space-x-1"
              >
                <span>🔔</span>
                <span>{notificationPermission === 'granted' ? 'Notif Aktif' : 'Izin Notif'}</span>
              </button>
            </div>

            {/* JAM REALTIME WIB */}
            <div className="bg-black/20 backdrop-blur-md rounded-2xl p-3 border border-white/10 flex justify-between items-center mt-2">
              <div>
                <div className="text-[11px] font-medium text-orange-200">{currentDateStr || "Memuat Tanggal..."}</div>
                <div className="text-xs text-orange-100 font-semibold">Hari: <span className="text-white font-bold">{currentDay}</span></div>
              </div>
              <div className="text-right">
                <div className="text-xl font-black font-mono tracking-wider text-yellow-300">{currentTime}</div>
                <div className="text-[9px] text-orange-200 uppercase tracking-widest font-bold">WIB (Asia/Jakarta)</div>
              </div>
            </div>

            {/* PROFIL UTAMA & TOMBOL HAPUS AKUN */}
            {currentUser && (
              <div className="mt-3 pt-2.5 border-t border-white/20 flex justify-between items-center text-xs">
                <div className="truncate mr-2">
                  <span className="opacity-80">Akun: </span>
                  <strong className="font-bold text-yellow-200">{currentUser.name}</strong> 
                  <span className="ml-1.5 bg-white/20 px-2 py-0.5 rounded-full text-[9px] uppercase font-bold">{currentUser.role}</span>
                </div>
                <button 
                  type="button"
                  onClick={() => setShowLogoutModal(true)} 
                  className="bg-red-950 hover:bg-black text-white font-bold px-3 py-1.5 rounded-xl shadow text-[10px] border border-red-400 shrink-0 touch-manipulation active:scale-95 transition"
                >
                  🗑️ Hapus Akun
                </button>
              </div>
            )}
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 p-4 overflow-y-auto custom-scrollbar">
            {!currentUser ? (
              <AuthFlow 
                onLogin={setCurrentUser} 
                students={students} 
                teachers={teachers}
                saveToCloud={saveToCloud}
                showToast={showToast}
              />
            ) : (
              <>
                {currentUser.role === 'WALI_MURID' && (
                  <WaliMuridDashboard 
                    user={currentUser} 
                    students={students} 
                    attendance={attendance}
                    permits={permits}
                    announcements={announcements}
                    grades={grades}
                    saveToCloud={saveToCloud}
                    showToast={showToast}
                    activeTab={activeTab}
                  />
                )}

                {currentUser.role === 'WALI_KELAS' && (
                  <WaliKelasDashboard 
                    user={currentUser} 
                    students={students} 
                    teachers={teachers}
                    attendance={attendance}
                    permits={permits}
                    announcements={announcements}
                    grades={grades}
                    saveToCloud={saveToCloud}
                    showToast={showToast}
                    activeTab={activeTab}
                    onOpenScanner={() => setShowCameraScanner(true)}
                  />
                )}

                {currentUser.role === 'OSIS' && (
                  <OsisDashboard 
                    user={currentUser} 
                    students={students} 
                    attendance={attendance}
                    schedule={schedule}
                    attributeChecks={attributeChecks}
                    saveToCloud={saveToCloud}
                    showToast={showToast}
                    activeTab={activeTab}
                    onOpenScanner={() => setShowCameraScanner(true)}
                  />
                )}
              </>
            )}
          </main>

          {/* FOOTER NAVIGATION */}
          {currentUser && (
            <BottomNav 
              role={currentUser.role} 
              activeTab={activeTab} 
              setActiveTab={setActiveTab} 
            />
          )}

          {/* KAMERA SCANNER QR MODAL ASLI ANDROID */}
          {showCameraScanner && (
            <RealCameraQRModal 
              onClose={() => setShowCameraScanner(false)}
              students={students}
              user={currentUser}
              schedule={schedule}
              attendance={attendance}
              saveToCloud={saveToCloud}
              showToast={showToast}
              sendAndroidPushNotification={sendAndroidPushNotification}
            />
          )}

          {/* LOGOUT CONFIRMATION MODAL */}
          {showLogoutModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4 border-2 border-red-500">
                <div className="text-center">
                  <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-2 font-bold">
                    ⚠️
                  </div>
                  <h3 className="font-black text-slate-800 text-base">Hapus Akun & Logout Permanen</h3>
                  <p className="text-xs text-slate-600 mt-2 leading-relaxed">
                    Tindakan ini akan <strong>menghapus akun Anda secara permanen</strong> dari perangkat ini dan membersihkan klaim kelas agar dapat digunakan oleh wali kelas baru.
                  </p>
                </div>

                <div className="flex space-x-2 pt-2">
                  <button 
                    onClick={() => setShowLogoutModal(false)}
                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition"
                  >
                    Batal
                  </button>
                  <button 
                    onClick={executePermanentLogout}
                    className="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl shadow transition"
                  >
                    Ya, Hapus Akun
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- AUTENTIKASI FORMULIR TANPA REDUNDANSI ---
    function AuthFlow({ onLogin, students, teachers, saveToCloud, showToast }) {
      const [selectedRole, setSelectedRole] = useState(null);
      const [regStep, setRegStep] = useState(1);

      const [parentForm, setParentForm] = useState({ parentName: '', parentPhone: '', studentName: '', studentClass: '7A', photo: '' });
      const [teacherForm, setTeacherForm] = useState({ name: '', classAssigned: '7A', phone: '' });
      const [osisForm, setOsisForm] = useState({ name: '', phone: '', pin: '' });

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 2 * 1024 * 1024) {
            showToast("Ukuran foto maksimal 2MB!", "error");
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            setParentForm(prev => ({ ...prev, photo: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleParentSubmit = async (e) => {
        e.preventDefault();
        const cleanPhone = normalizePhone(parentForm.parentPhone);
        if (!cleanPhone) {
          showToast("Nomor HP orang tua wajib diisi!", "error");
          return;
        }

        const existingStudent = students.find(s => normalizePhone(s.parentPhone) === cleanPhone);
        if (existingStudent) {
          showToast(`Selamat datang kembali, ${existingStudent.parentName}!`);
          onLogin({ role: 'WALI_MURID', name: existingStudent.parentName, phone: cleanPhone, studentId: existingStudent.id });
          return;
        }

        if (!parentForm.parentName.trim() || !parentForm.studentName.trim() || !parentForm.photo) {
          showToast("Mohon lengkapi nama ortu, nama siswa, dan foto siswa!", "error");
          return;
        }

        const newId = `STD-${parentForm.studentClass}-${Date.now().toString().slice(-4)}`;
        const newStudent = {
          id: newId,
          name: parentForm.studentName.trim(),
          class: parentForm.studentClass,
          parentName: parentForm.parentName.trim(),
          parentPhone: cleanPhone,
          photo: parentForm.photo,
          qrCode: newId,
          createdAt: new Date().toISOString()
        };

        await saveToCloud('students', newId, newStudent);
        showToast("Pendaftaran Wali Murid Berhasil! Kartu QR Tersimpan di Database.");
        onLogin({ role: 'WALI_MURID', name: parentForm.parentName.trim(), phone: cleanPhone, studentId: newId });
      };

      const handleTeacherSubmit = async (e) => {
        e.preventDefault();
        const cleanPhone = normalizePhone(teacherForm.phone);
        if (!cleanPhone) {
          showToast("Nomor HP Wali Kelas wajib diisi!", "error");
          return;

    // --- REAL CAMERA SCANNER MODAL WITH HTML5-QRCODE ---
    function RealCameraQRModal({ onClose, students, user, schedule, attendance, saveToCloud, showToast, sendAndroidPushNotification }) {
      const [scanMode, setScanMode] = useState('ATTENDANCE');
      const [cameraError, setCameraError] = useState(null);
      const scannerRef = useRef(null);

      useEffect(() => {
        let html5QrCode = null;
        const startScanner = async () => {
          try {
            html5QrCode = new Html5Qrcode("reader");
            scannerRef.current = html5QrCode;
            await html5QrCode.start(
              { facingMode: "environment" },
              { fps: 10, qrbox: { width: 220, height: 220 } },
              (qrCodeMessage) => {
                handleScannedValue(qrCodeMessage);
              },
              (errorMessage) => {}
            );
          } catch (err) {
            setCameraError("Izin kamera Android belum diberikan atau kamera tidak tersedia.");
          }
        };

        startScanner();

        return () => {
          if (scannerRef.current && scannerRef.current.isScanning) {
            scannerRef.current.stop().catch(() => {});
          }
        };
      }, [scanMode]);

      const handleScannedValue = async (qrString) => {
        const found = students.find(s => s.qrCode === qrString || s.id === qrString);
        if (!found) {
          showToast("QR Code tidak valid / Siswa tidak ditemukan!", "error");
          return;
        }

        const todayDate = getJakartaDate();
        const nowTimeStr = getJakartaTimeString();

        if (scanMode === 'ATTENDANCE') {
          const alreadyAttended = attendance.find(a => a.studentId === found.id && a.date === todayDate);
          if (alreadyAttended) {
            showToast(`Siswa ${found.name} sudah melakukan absensi hari ini (${alreadyAttended.time} WIB)!`, "warning");
            return;
          }

          const isLate = nowTimeStr > schedule.onTimeLimit;
          const statusResult = isLate ? "Terlambat" : "Hadir";
          const attId = `ATT-${Date.now()}`;

          const newAttendanceRecord = {
            id: attId,
            studentId: found.id,
            studentName: found.name,
            class: found.class,
            date: todayDate,
            time: nowTimeStr,
            status: statusResult,
            method: 'SCAN_KAMERA_ANDROID',
            officer: `${user.role} (${user.name})`,
            note: isLate ? "Terlambat hadir" : "Hadir tepat waktu"
          };

          await saveToCloud('attendance', attId, newAttendanceRecord);
          showToast(`BERHASIL: Absensi ${found.name} (${statusResult})!`, isLate ? "warning" : "success");
          sendAndroidPushNotification("Notifikasi Presensi", `${found.name} (${found.class}) tercatat ${statusResult} jam ${nowTimeStr} WIB.`);
          onClose();
        }
      };

      return (
        <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col p-4 justify-between">
          <div className="flex justify-between items-center text-white">
            <h3 className="font-black text-sm">Pemindai QR Kamera Android</h3>
            <button onClick={onClose} className="px-3 py-1 bg-red-600 text-white rounded-xl text-xs font-bold">Tutup ✕</button>
          </div>

          <div className="my-auto flex flex-col items-center">
            <div className="w-full max-w-xs bg-slate-800 rounded-2xl overflow-hidden border-2 border-orange-500 shadow-2xl relative">
              <div id="reader" className="w-full"></div>
            </div>

            {cameraError && (
              <div className="mt-4 p-3 bg-red-900/80 text-white text-xs rounded-xl text-center max-w-xs">
                ⚠️ {cameraError}
              </div>
            )}
          </div>

          <div className="text-center text-white text-[10px] opacity-80 pb-2">
            Arahkan kamera HP ke Kartu QR Siswa untuk absensi otomatis
          </div>
        </div>
      );
    }

              type="button"
              onClick={onOpenScanner}
              className="bg-white text-red-600 font-bold px-3 py-2 rounded-xl shadow text-xs flex items-center space-x-1 active:scale-95 transition"
            >
              <span>📷</span> <span>Scan QR</span>
            </button>
          </div>

          <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
            <h3 className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Daftar Siswa Kelas {user.class}</h3>
            {classStudents.map(s => (
              <div key={s.id} className="py-2 border-b border-slate-100 flex justify-between items-center text-xs">
                <div>
                  <div className="font-bold text-slate-800">{s.name}</div>
                  <div className="text-[10px] text-slate-400">Ortu: {s.parentName}</div>
                </div>
                <span className="text-[10px] bg-slate-100 px-2 py-0.5 rounded font-bold text-slate-600">{s.id}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- DASHBOARD OSIS ---
    function OsisDashboard({ user, students, schedule, saveToCloud, showToast, activeTab, onOpenScanner }) {
      return (
        <div className="space-y-4">
          <div className="bg-slate-900 text-white p-4 rounded-2xl shadow-md flex justify-between items-center border-l-4 border-orange-500">
            <div>
              <span className="text-[9px] text-orange-400 uppercase font-bold">Petugas OSIS</span>
              <h2 className="text-base font-black">{user.name}</h2>
              <p className="text-[11px] text-slate-400">Batas Tepat Waktu: {schedule.onTimeLimit} WIB</p>
            </div>

            <button 
              type="button"
              onClick={onOpenScanner}
              className="bg-gradient-to-r from-red-600 to-orange-500 text-white font-bold px-3 py-2 rounded-xl shadow text-xs flex items-center space-x-1 active:scale-95 transition"
            >
              <span>📷</span> <span>Buka Kamera Scan</span>
            </button>
          </div>
        </div>
      );
    }

    // --- BOTTOM NAVIGATION ---
    function BottomNav({ role, activeTab, setActiveTab }) {
      return (
        <nav className="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-200 px-4 py-2 flex justify-around items-center z-40 shadow-lg">
          <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center space-y-0.5 ${activeTab === 'home' ? 'text-red-600 font-bold' : 'text-slate-400'}`}>
            <span className="text-base">🏠</span>
            <span className="text-[9px]">Beranda</span>
          </button>

          {role === 'WALI_MURID' && (
            <button onClick={() => setActiveTab('permit')} className={`flex flex-col items-center space-y-0.5 ${activeTab === 'permit' ? 'text-red-600 font-bold' : 'text-slate-400'}`}>
              <span className="text-base">📝</span>
              <span className="text-[9px]">Surat Izin</span>
            </button>
          )}
        </nav>
      );
    }

    // --- RENDER ROOT ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
