  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Centralized Firebase Config
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'eabsensi-smp-central-v4';
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
    
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyEAbsensiCentralDatabaseKey2026",
          authDomain: "eabsensi-smp-central.firebaseapp.com",
          projectId: "eabsensi-smp-central",
          storageBucket: "eabsensi-smp-central.appspot.com",
          messagingSenderId: "102938475610",
          appId: "1:102938475610:web:9876543210abcdef"
        };

    let app, auth, db;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Firebase initialized in fallback mode:", e);
    }

    // Expose Bridge to React App
    window.FirebaseBridge = {
      app, auth, db, appId, initialAuthToken,
      signInAnonymously, signInWithCustomToken, onAuthStateChanged,
      doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection,
      isConfigured: !!db
    };

    window.dispatchEvent(new Event('firebase-bridge-ready'));
  </script>

  <div id="root" class="w-full max-w-md min-h-screen sm:min-h-[92vh] bg-white sm:rounded-3xl shadow-2xl relative flex flex-col overflow-hidden border border-orange-100"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- STANDARDISASI KELAS 7A-7G, 8A-8G, 9A-9G ---
    const KELAS_LIST = [
      '7A', '7B', '7C', '7D', '7E', '7F', '7G',
      '8A', '8B', '8C', '8D', '8E', '8F', '8G',
      '9A', '9B', '9C', '9D', '9E', '9F', '9G'
    ];

    const MATA_PELAJARAN = [
      'Matematika',
      'Bahasa Indonesia',
      'Bahasa Inggris',
      'Ilmu Pengetahuan Alam (IPA)',
      'Ilmu Pengetahuan Sosial (IPS)',
      'Pendidikan Agama & Budi Pekerti',
      'Pancasila & Kewarganegaraan (PKn)',
      'Pendidikan Jasmani, Olahraga, & Kesehatan (PJOK)',
      'Seni Budaya & Prakarya'
    ];

    const ATRIBUT_HARI = {
      'Senin': ['Dasi', 'Kaus kaki putih', 'Lokasi sekolah', 'Logo sekolah', 'Bendera', 'Nama', 'Kartu QR', 'Pemeriksaan kuku'],
      'Selasa': ['Kaus kaki putih', 'Pemeriksaan kuku'],
      'Rabu': ['Kacu', 'Kaus kaki hitam', 'Nama', 'Nama pahlawan', 'Pemeriksaan kuku'],
      'Kamis': ['Dasi', 'Kaus kaki putih', 'Lokasi sekolah', 'Logo sekolah', 'Bendera', 'Nama', 'Kartu QR', 'Pemeriksaan kuku'],
      'Jumat': ['Kaus kaki putih', 'Nama', 'Pemeriksaan kuku'],
      'Sabtu': ['Kaus kaki putih', 'Nama', 'Pemeriksaan kuku'],
      'Minggu': []
    };

    const INITIAL_SCHEDULE = {
      startTime: "05:30",
      onTimeLimit: "06:30",
      updatedBy: "Petugas OSIS",
      updatedAt: new Date().toISOString()
    };

    function normalizePhone(phone) {
      if (!phone) return '';
      let clean = String(phone).trim().replace(/\D/g, '');
      if (clean.startsWith('62')) {
        clean = '0' + clean.slice(2);
      }
      return clean;
    }

    function getJakartaDate() {
      const options = { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' };
      return new Intl.DateTimeFormat('en-CA', options).format(new Date());
    }

    function getJakartaTimeString() {
      return new Date().toLocaleTimeString('id-ID', {
        timeZone: 'Asia/Jakarta',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).replace(/\./g, ':');
    }

    function getJakartaDayName() {
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const dateInJakarta = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));
      return days[dateInJakarta.getDay()];
    }

    // --- MAIN REACT APP ---
    function App() {
      const [students, setStudents] = useState([]);
      const [attendance, setAttendance] = useState([]);
      const [teachers, setTeachers] = useState([]);
      const [schedule, setSchedule] = useState(INITIAL_SCHEDULE);
      const [permits, setPermits] = useState([]);
      const [announcements, setAnnouncements] = useState([]);
      const [grades, setGrades] = useState([]);
      const [attributeChecks, setAttributeChecks] = useState([]);

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('eabsensi_current_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [currentTime, setCurrentTime] = useState(getJakartaTimeString());
      const [currentDateStr, setCurrentDateStr] = useState('');
      const [currentDay, setCurrentDay] = useState(getJakartaDayName());

      const [activeTab, setActiveTab] = useState('home');
      const [notification, setNotification] = useState(null);
      const [showLogoutModal, setShowLogoutModal] = useState(false);
      const [showCameraScanner, setShowCameraScanner] = useState(false);
      const [scanTargetMode, setScanTargetMode] = useState('ATTENDANCE'); // ATTENDANCE vs ATTRIBUTE
      const [notificationPermission, setNotificationPermission] = useState('default');
      const [showSidebar, setShowSidebar] = useState(false);

      useEffect(() => {
        if ("Notification" in window) {
          setNotificationPermission(Notification.permission);
        }
      }, []);

      const requestAndroidNotification = async () => {
        if ("Notification" in window) {
          const perm = await Notification.requestPermission();
          setNotificationPermission(perm);
          if (perm === 'granted') {
            showToast("Izin notifikasi Android aktif!", "success");
            sendAndroidPushNotification("E-Absensi Digital", "Notifikasi presensi online telah diaktifkan.");
          } else {
            showToast("Izin notifikasi ditolak. Aktifkan di pengaturan HP.", "warning");
          }
        }
      };

      const sendAndroidPushNotification = (title, body) => {
        if ("Notification" in window && Notification.permission === "granted") {
          try {
            new Notification(title, {
              body,
              icon: 'https://placehold.co/192x192/DC2626/FFFFFF?text=E-Absensi',
              badge: 'https://placehold.co/192x192/DC2626/FFFFFF?text=E'
            });
          } catch (e) {
            console.warn("Notification error:", e);
          }
        }
      };

      // Realtime Firebase Central Sync
      useEffect(() => {
        let unsubscribes = [];
        const initCloudSync = async () => {
          const fb = window.FirebaseBridge;
          if (!fb || !fb.isConfigured) return;

          try {
            if (fb.initialAuthToken) {
              await fb.signInWithCustomToken(fb.auth, fb.initialAuthToken);
            } else {
              await fb.signInAnonymously(fb.auth);
            }

            fb.onAuthStateChanged(fb.auth, (user) => {
              if (user) {
                const listenCollection = (colName, setter) => {
                  try {
                    const colRef = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', colName);
                    const unsub = fb.onSnapshot(colRef, (snapshot) => {
                      const data = [];
                      snapshot.forEach(doc => data.push(doc.data()));
                      setter(data);
                    });
                    unsubscribes.push(unsub);
                  } catch (e) {}
                };

                listenCollection('students', setStudents);
                listenCollection('attendance', setAttendance);
                listenCollection('teachers', setTeachers);
                listenCollection('permits', setPermits);
                listenCollection('announcements', setAnnouncements);
                listenCollection('grades', setGrades);
                listenCollection('attribute_checks', setAttributeChecks);

                // Schedule Listener
                try {
                  const schedRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'config', 'schedule');
                  const unsubSched = fb.onSnapshot(schedRef, (docSnap) => {
                    if (docSnap.exists()) {
                      setSchedule(docSnap.data());
                    }
                  });
                  unsubscribes.push(unsubSched);
                } catch (e) {}
              }
            });
          } catch (e) {}
        };

        if (window.FirebaseBridge) {
          initCloudSync();
        } else {
          window.addEventListener('firebase-bridge-ready', initCloudSync);
        }

        return () => {
          unsubscribes.forEach(unsub => unsub && unsub());
          window.removeEventListener('firebase-bridge-ready', initCloudSync);
        };
      }, []);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('eabsensi_current_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('eabsensi_current_user');
        }
      }, [currentUser]);

      // Clock
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(getJakartaTimeString());
          setCurrentDay(getJakartaDayName());
          const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Jakarta' };
          setCurrentDateStr(new Date().toLocaleDateString('id-ID', options));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const saveToCloud = async (collectionName, docId, data) => {
        const fb = window.FirebaseBridge;
        if (fb && fb.isConfigured && fb.auth?.currentUser) {
          try {
            const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', collectionName, docId);
            await fb.setDoc(docRef, data, { merge: true });
          } catch (e) {
            console.warn(`Cloud save error [${collectionName}]:`, e);
          }
        }
      };

      const showToast = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 4000);
      };

      // PERMANENT LOGOUT EXECUTION
      const executePermanentLogout = async () => {
        if (!currentUser) return;

        if (currentUser.role === 'WALI_KELAS') {
          const fb = window.FirebaseBridge;
          if (fb && fb.isConfigured && fb.auth?.currentUser) {
            try {
              const docId = `TCH-${currentUser.class}`;
              const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'teachers', docId);
              await fb.deleteDoc(docRef);
            } catch (e) {}
          }
        }

        setCurrentUser(null);
        localStorage.removeItem('eabsensi_current_user');
        setActiveTab('home');
        setShowLogoutModal(false);
        showToast("Akun Anda telah dihapus secara permanen.", "info");
      };

      const triggerOpenScanner = (mode = 'ATTENDANCE') => {
        setScanTargetMode(mode);
        setShowCameraScanner(true);
      };

      return (
        <div className="w-full min-h-screen sm:min-h-[92vh] bg-slate-50 flex flex-col pb-20 relative">
          
          {/* TOAST NOTIFICATION */}
          {notification && (
            <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-11/12 max-w-sm px-4 py-3 rounded-2xl shadow-2xl text-white font-medium text-xs flex items-center justify-between transition-all duration-300 ${
              notification.type === 'error' ? 'bg-red-600' : notification.type === 'warning' ? 'bg-amber-600' : 'bg-emerald-600'
            }`}>
              <div className="flex items-center space-x-2">
                <span>{notification.type === 'error' ? '⚠️' : '✅'}</span>
                <span>{notification.message}</span>
              </div>
              <button onClick={() => setNotification(null)} className="text-white font-bold text-base ml-2">×</button>
            </div>
          )}

          {/* HEADER APLIKASI TEMA MERAH-ORANYE */}
          <header className="gradient-header text-white p-4 sm:p-5 rounded-b-3xl shadow-lg relative overflow-hidden shrink-0">
            <div className="flex justify-between items-center mb-2">
              <div className="flex items-center space-x-3">
                {currentUser && (
                  <button 
                    onClick={() => setShowSidebar(true)} 
                    className="w-9 h-9 bg-white/20 hover:bg-white/30 rounded-xl flex items-center justify-center text-white text-lg font-bold shadow"
                  >
                    ☰
                  </button>
                )}
                <div className="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-brandRed font-black text-xl shadow-md">
                  E
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-black tracking-tight leading-none">E-ABSENSI SMP</h1>
                  <p className="text-[10px] text-orange-100 mt-0.5">Sistem Presensi & Nilai Digital</p>
                </div>
              </div>

              {/* NOTIFICATION PERMISSION BADGE */}
              <button 
                onClick={requestAndroidNotification} 
                className="bg-black/20 hover:bg-black/40 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/20 text-[10px] text-white font-semibold flex items-center space-x-1"
              >
                <span>🔔</span>
                <span>{notificationPermission === 'granted' ? 'Notif On' : 'Izin Notif'}</span>
              </button>
            </div>

            {/* JAM REALTIME WIB */}
            <div className="bg-black/20 backdrop-blur-md rounded-2xl p-3 border border-white/10 flex justify-between items-center mt-2">
              <div>
                <div className="text-[11px] font-medium text-orange-200">{currentDateStr || "Memuat Tanggal..."}</div>
                <div className="text-xs text-orange-100 font-semibold">Hari: <span className="text-white font-bold">{currentDay}</span></div>
              </div>
              <div className="text-right">
                <div className="text-xl font-black font-mono tracking-wider text-yellow-300">{currentTime}</div>
                <div className="text-[9px] text-orange-200 uppercase tracking-widest font-bold">WIB (Asia/Jakarta)</div>
              </div>
            </div>

            {/* PROFIL RINGKAS */}
            {currentUser && (
              <div className="mt-3 pt-2.5 border-t border-white/20 flex justify-between items-center text-xs">
                <div className="truncate mr-2">
                  <span className="opacity-80">Akun: </span>
                  <strong className="font-bold text-yellow-200">{currentUser.name}</strong> 
                  <span className="ml-1.5 bg-white/20 px-2 py-0.5 rounded-full text-[9px] uppercase font-bold">{currentUser.role}</span>
                </div>
                <button 
                  type="button"
                  onClick={() => setShowLogoutModal(true)} 
                  className="bg-red-950/80 hover:bg-black text-white font-bold px-2.5 py-1 rounded-xl shadow text-[10px] border border-red-400/50 shrink-0 touch-manipulation"
                >
                  🗑️ Hapus Akun
                </button>
              </div>
            )}
          </header>

          {/* SIDEBAR NAVIGATION (DENGAN TEMA MERAH ORANYE, BUKAN HITAM) */}
          {showSidebar && (
            <div className="fixed inset-0 z-50 flex">
              <div className="fixed inset-0 bg-black/50 backdrop-blur-sm" onClick={() => setShowSidebar(false)}></div>
              <div className="relative w-4/5 max-w-xs gradient-sidebar text-white h-full shadow-2xl p-5 flex flex-col justify-between z-10">
                <div>
                  <div className="flex justify-between items-center pb-4 border-b border-white/20 mb-4">
                    <div className="flex items-center space-x-2">
                      <div className="w-8 h-8 bg-white text-brandRed rounded-xl flex items-center justify-center font-black text-base shadow">E</div>
                      <span className="font-black text-sm tracking-wide">MENU UTAMA</span>
                    </div>
                    <button onClick={() => setShowSidebar(false)} className="text-white font-bold text-lg bg-white/10 w-8 h-8 rounded-xl flex items-center justify-center">✕</button>
                  </div>

                  <div className="space-y-2 text-xs">
                    <button 
                      onClick={() => { setActiveTab('home'); setShowSidebar(false); }}
                      className={`w-full p-3 rounded-xl font-bold flex items-center space-x-3 text-left transition ${activeTab === 'home' ? 'bg-white text-brandRed shadow' : 'hover:bg-white/10 text-white'}`}
                    >
                      <span>🏠</span> <span>Beranda</span>
                    </button>

                    {currentUser?.role === 'WALI_MURID' && (
                      <>
                        <button 
                          onClick={() => { setActiveTab('grades'); setShowSidebar(false); }}
                          className={`w-full p-3 rounded-xl font-bold flex items-center space-x-3 text-left transition ${activeTab === 'grades' ? 'bg-white text-brandRed shadow' : 'hover:bg-white/10 text-white'}`}
                        >
                          <span>📊</span> <span>Nilai Anak</span>
                        </button>
                        <button 
                          onClick={() => { setActiveTab('permit'); setShowSidebar(false); }}
                          className={`w-full p-3 rounded-xl font-bold flex items-center space-x-3 text-left transition ${activeTab === 'permit' ? 'bg-white text-brandRed shadow' : 'hover:bg-white/10 text-white'}`}
                        >
                          <span>📝</span> <span>Surat Izin / Sakit</span>
                        </button>
                      </>
                    )}

                    {currentUser?.role === 'WALI_KELAS' && (
                      <>
                        <button 
                          onClick={() => { setActiveTab('manage_grades'); setShowSidebar(false); }}
                          className={`w-full p-3 rounded-xl font-bold flex items-center space-x-3 text-left transition ${activeTab === 'manage_grades' ? 'bg-white text-brandRed shadow' : 'hover:bg-white/10 text-white'}`}
                        >
                          <span>📊</span> <span>Kelola Nilai Siswa</span>
                        </button>
                        <button 
                          onClick={() => { setActiveTab('recap'); setShowSidebar(false); }}
                          className={`w-full p-3 rounded-xl font-bold flex items-center space-x-3 text-left transition ${activeTab === 'recap' ? 'bg-white text-brandRed shadow' : 'hover:bg-white/10 text-white'}`}
                        >
                          <span>📑</span> <span>Rekap Absensi Bulanan</span>
                        </button>
                      </>
                    )}

                    {currentUser?.role === 'OSIS' && (
                      <button 
                        onClick={() => { setActiveTab('schedule'); setShowSidebar(false); }}
                        className={`w-full p-3 rounded-xl font-bold flex items-center space-x-3 text-left transition ${activeTab === 'schedule' ? 'bg-white text-brandRed shadow' : 'hover:bg-white/10 text-white'}`}
                      >
                        <span>⏱️</span> <span>Atur Jam Masuk</span>
                      </button>
                    )}
                  </div>
                </div>

                <div className="pt-4 border-t border-white/20">
                  <button 
                    onClick={() => { setShowSidebar(false); setShowLogoutModal(true); }}
                    className="w-full py-2.5 bg-red-950/80 hover:bg-black text-white font-bold rounded-xl text-xs flex items-center justify-center space-x-2 shadow border border-red-400/40"
                  >
                    <span>🗑️</span> <span>Hapus Akun & Logout</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 p-4 overflow-y-auto custom-scrollbar">
            {!currentUser ? (
              <AuthFlow 
                onLogin={setCurrentUser} 
                students={students} 
                teachers={teachers}
                saveToCloud={saveToCloud}
                showToast={showToast}
              />
            ) : (
              <>
                {currentUser.role === 'WALI_MURID' && (
                  <WaliMuridDashboard 
                    user={currentUser} 
                    students={students} 
                    attendance={attendance}
                    permits={permits}
                    announcements={announcements}
                    grades={grades}
                    saveToCloud={saveToCloud}
                    showToast={showToast}
                    activeTab={activeTab}
                  />
                )}

                {currentUser.role === 'WALI_KELAS' && (
                  <WaliKelasDashboard 
                    user={currentUser} 
                    students={students} 
                    teachers={teachers}
                    attendance={attendance}
                    permits={permits}
                    announcements={announcements}
                    grades={grades}
                    saveToCloud={saveToCloud}
                    showToast={showToast}
                    activeTab={activeTab}
                    onOpenScanner={() => triggerOpenScanner('ATTENDANCE')}
                  />
                )}

                {currentUser.role === 'OSIS' && (
                  <OsisDashboard

    function RealCameraQRModal({ scanTargetMode, onClose, students, user, schedule, attendance, attributeChecks, saveToCloud, showToast, sendAndroidPushNotification }) {
      const [cameraError, setCameraError] = useState(null);
      const [scannedStudent, setScannedStudent] = useState(null);
      const [checkedItems, setCheckedItems] = useState({});
      const scannerRef = useRef(null);

      useEffect(() => {
        let html5QrCode = null;
        const startScanner = async () => {
          try {
            html5QrCode = new Html5Qrcode("reader");
            scannerRef.current = html5QrCode;
            await html5QrCode.start(
              { facingMode: "environment" },
              { fps: 10, qrbox: { width: 220, height: 220 } },
              (qrCodeMessage) => {
                handleScannedValue(qrCodeMessage);
              },
              (errorMessage) => {}
            );
          } catch (err) {
            setCameraError("Izin kamera Android belum diberikan atau kamera tidak tersedia.");
          }
        };

        startScanner();

        return () => {
          if (scannerRef.current && scannerRef.current.isScanning) {
            scannerRef.current.stop().catch(() => {});
          }
        };
      }, [scanTargetMode]);

      const handleScannedValue = async (qrString) => {
        const found = students.find(s => s.qrCode === qrString || s.id === qrString);
        if (!found) {
          showToast("QR Code tidak valid / Siswa tidak ditemukan!", "error");
          return;
        }

        const todayDate = getJakartaDate();
        const nowTimeStr = getJakartaTimeString();

        if (scanTargetMode === 'ATTENDANCE') {
          const alreadyAttended = attendance.find(a => a.studentId === found.id && a.date === todayDate);
          if (alreadyAttended) {
            showToast(`Siswa ${found.name} sudah melakukan absensi hari ini (${alreadyAttended.time} WIB)!`, "warning");
            return;
          }

          const isLate = nowTimeStr > schedule.onTimeLimit;
          const statusResult = isLate ? "Terlambat" : "Hadir";
          const attId = `ATT-${Date.now()}`;

          const newAttendanceRecord = {
            id: attId,
            studentId: found.id,
            studentName: found.name,
            class: found.class,
            date: todayDate,
            time: nowTimeStr,
            status: statusResult,
            method: 'SCAN_KAMERA_ANDROID',
            officer: `${user.role} (${user.name})`,
            note: isLate ? "Terlambat hadir" : "Hadir tepat waktu"
          };

          await saveToCloud('attendance', attId, newAttendanceRecord);
          showToast(`BERHASIL: Absensi ${found.name} (${statusResult})!`, isLate ? "warning" : "success");
          sendAndroidPushNotification("Notifikasi Presensi", `${found.name} (${found.class}) tercatat ${statusResult} jam ${nowTimeStr} WIB.`);
          onClose();
        } else {
          // MODE PEMERIKSAAN ATRIBUT
          setScannedStudent(found);
          if (scannerRef.current && scannerRef.current.isScanning) {
            scannerRef.current.stop().catch(() => {});
          }
        }
      };

      const handleSaveAttributes = async () => {
        if (!scannedStudent) return;
        const todayDate = getJakartaDate();
        const dayName = getJakartaDayName();
        const checkId = `ATTR-${scannedStudent.id}-${todayDate}`;

        const record = {
          id: checkId,
          studentId: scannedStudent.id,
          studentName: scannedStudent.name,
          class: scannedStudent.class,
          date: todayDate,
          day: dayName,
          itemsChecked: checkedItems,
          officer: `${user.role} (${user.name})`,
          updatedAt: new Date().toISOString()
        };

        await saveToCloud('attribute_checks', checkId, record);
        showToast(`Pemeriksaan atribut ${scannedStudent.name} tersimpan!`);
        onClose();
      };

      const dayName = getJakartaDayName();
      const currentDayAttrList = ATRIBUT_HARI[dayName] || [];

      return (
        <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col p-4 justify-between">
          <div className="flex justify-between items-center text-white">
            <h3 className="font-black text-sm">
              {scanTargetMode === 'ATTENDANCE' ? 'Pemindai QR Absensi' : 'Pemeriksaan Atribut Siswa'}
            </h3>
            <button onClick={onClose} className="px-3 py-1 bg-red-600 text-white rounded-xl text-xs font-bold">Tutup ✕</button>
          </div>

          {!scannedStudent ? (
            <div className="my-auto flex flex-col items-center">
              <div className="w-full max-w-xs bg-slate-800 rounded-2xl overflow-hidden border-2 border-orange-500 shadow-2xl relative">
                <div id="reader" className="w-full"></div>
              </div>

              {cameraError && (
                <div className="mt-4 p-3 bg-red-900/80 text-white text-xs rounded-xl text-center max-w-xs">
                  ⚠️ {cameraError}
                  <p className="text-[10px] mt-1 text-red-200">Buka Pengaturan HP → Aplikasi → E-Absensi → Izin → Kamera.</p>
                </div>
              )}
            </div>
          ) : (
            <div className="bg-white p-4 rounded-2xl max-w-xs mx-auto w-full my-auto space-y-3">
              <div className="flex items-center space-x-3">
                <img src={scannedStudent.photo || "https://placehold.co/100x100/DC2626/FFFFFF?text=Siswa"} className="w-14 h-14 rounded-xl object-cover border-2 border-orange-500" />
                <div>
                  <h4 className="font-bold text-slate-800 text-sm">{scannedStudent.name}</h4>
                  <p className="text-xs text-orange-600 font-bold">Kelas {scannedStudent.class}</p>
                  {scanTargetMode === 'ATTENDANCE' && (
                    <p className="text-[10px] text-slate-500">Ortu: {scannedStudent.parentName}</p>
                  )}
                </div>
              </div>

              <div className="border-t pt-2 space-y-1 max-h-48 overflow-y-auto">
                <p className="text-[10px] font-bold text-slate-400 uppercase">Checklist Atribut Hari {dayName}</p>
                {currentDayAttrList.length === 0 ? (
                  <p className="text-xs text-slate-500 italic">Tidak ada kelengkapan khusus hari ini.</p>
                ) : (
                  currentDayAttrList.map(item => (

            return;

          const reader = new FileReader();

          reader.readAsDataURL(file);

          studentId: student.id,

          type: permitForm.type,
          reason: permitForm.reason,
          attachment: permitForm.attachment || '',
          status: 'PENDING',
          submittedAt: new Date().toISOString()

    function QRCodeView({ qrValue, studentName }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (canvasRef.current && window.QRCode) {
          try {
            window.QRCode.toCanvas(canvasRef.current, qrValue, {
              width: 160,
              margin: 1,
              color: { dark: '#000000', light: '#FFFFFF' }
            });
          } catch (e) {}
        }
      }, [qrValue]);

      const downloadQR = () => {
        if (canvasRef.current) {
          const image = canvasRef.current.toDataURL("image/png");
          const link = document.createElement('a');
          link.href = image;
          link.download = `QR-${studentName.replace(/\s+/g, '_')}.png`;
          link.click();
        }
      };

      return (
        <div className="flex flex-col items-center justify-center p-3 bg-white rounded-2xl shadow-inner border border-slate-200">
          {/* PEMBUNGKUS PERSEGI MURNI (ASPECT 1:1) MENCEGAH QR GEPENG */}
          <div className="w-36 h-36 aspect-square flex items-center justify-center bg-white rounded-xl p-1 shadow-sm border border-slate-100">
            <canvas ref={canvasRef} className="w-full h-full object-contain"></canvas>
          </div>
          <button 
            type="button" 
            onClick={downloadQR} 
            className="mt-3 px-3.5 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-[10px] font-bold rounded-xl flex items-center space-x-1 shadow"
          >
            <span>📥</span> <span>Unduh Gambar QR (PNG)</span>
          </button>
        </div>
      );
    }

    function WaliKelasDashboard({ user, students, attendance, permits, grades, saveToCloud, showToast, activeTab, onOpenScanner }) {

          id: gradeDocId,

          studentName: studentObj ? studentObj.name : 'Siswa',

          subject: gradeForm.subject,
          score: scoreNum,
          semester: gradeForm.semester,
          note: gradeForm.note,
          updatedAt: new Date().toISOString()

                <span className="text-base">📊</span>
                <span className="text-[9px]">Kelola Nilai</span>
              </button>
              <button onClick={() => setActiveTab('recap')} className={`flex flex-col items-center space-y-0.5 ${activeTab === 'recap' ? 'text-brandRed font-bold' : 'text-slate-400'}`}>
                <span className="text-base">📑</span>
                <span className="text-[9px]">Rekap</span>
              </button>
            </>
          )}

          {role === 'OSIS' && (
            <button onClick={() => setActiveTab('schedule')} className={`flex flex-col items-center space-y-0.5 ${activeTab === 'schedule' ? 'text-brandRed font-bold' : 'text-slate-400'}`}>
              <span className="text-base">⏱️</span>
              <span className="text-[9px]">Jam Masuk</span>
            </button>
          )}
        </nav>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
